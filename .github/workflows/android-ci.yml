name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Domyslnie akcja instaluje pakiet 'tools', ktorego NIE MA juz
          # w cmdline-tools 16.0 - sdkmanager konczy sie wtedy exit 1.
          # Pakiety, ktore realnie potrzebujemy, instaluje krok ponizej.
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test, compile, build debug APK and run lint
        run: ./gradlew --no-daemon testDebugUnitTest compileDebugKotlin assembleDebug lintDebug assembleDebugAndroidTest

      - name: Enable KVM for Compose semantics tests
        run: sudo chmod 666 /dev/kvm

      - name: Measure Compose semantics on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tyflocentrum-android-tests
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/reports/lint-results-debug.xml
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tyflocentrum-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: tyflocentrum-android-lint-report
          path: app/build/reports/lint-results-debug.html
